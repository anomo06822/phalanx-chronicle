name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  BUILD_NAME: PhalanxChronicle
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_PATH: .
  TARGET_PLATFORM: StandaloneOSX

jobs:
  preflight:
    name: Release Preconditions
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64 }}
      APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
      APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      APPLE_NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    outputs:
      has_apple_notarization_credentials: ${{ steps.apple-notarization-check.outputs.has_apple_notarization_credentials }}
      has_unity_credentials: ${{ steps.unity-check.outputs.has_unity_credentials }}
      release_tag: ${{ steps.release-metadata.outputs.release_tag }}

    steps:
      - name: Capture release metadata
        id: release-metadata
        run: |
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Check Unity credentials
        id: unity-check
        run: |
          has_unity_credentials=false

          if [ -n "${UNITY_LICENSE}" ] && [ -n "${UNITY_EMAIL}" ] && [ -n "${UNITY_PASSWORD}" ]; then
            has_unity_credentials=true
          elif [ -n "${UNITY_EMAIL}" ] && [ -n "${UNITY_PASSWORD}" ] && [ -n "${UNITY_SERIAL}" ]; then
            has_unity_credentials=true
          fi

          echo "has_unity_credentials=${has_unity_credentials}" >> "${GITHUB_OUTPUT}"

          if [ "${has_unity_credentials}" != "true" ]; then
            echo "Unity credentials are incomplete, so the macOS build and GitHub Release publish steps will be skipped." >> "${GITHUB_STEP_SUMMARY}"
            echo "Personal license requires UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD." >> "${GITHUB_STEP_SUMMARY}"
            echo "Professional license requires UNITY_EMAIL, UNITY_PASSWORD, and UNITY_SERIAL." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Check Apple notarization credentials
        id: apple-notarization-check
        run: |
          has_apple_notarization_credentials=false

          if [ -n "${APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64}" ] && \
             [ -n "${APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD}" ] && \
             [ -n "${APPLE_NOTARY_APPLE_ID}" ] && \
             [ -n "${APPLE_NOTARY_APP_SPECIFIC_PASSWORD}" ] && \
             [ -n "${APPLE_TEAM_ID}" ]; then
            has_apple_notarization_credentials=true
          fi

          echo "has_apple_notarization_credentials=${has_apple_notarization_credentials}" >> "${GITHUB_OUTPUT}"

          if [ "${has_apple_notarization_credentials}" != "true" ]; then
            echo "Apple notarization secrets are incomplete, so the release asset will remain unsigned and not notarized." >> "${GITHUB_STEP_SUMMARY}"
          fi

  build-macos:
    name: Build macOS Release
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_unity_credentials == 'true'
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Create local tag for manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag -f "${RELEASE_TAG}" "${GITHUB_SHA}"

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: Library
          key: Library-${{ env.TARGET_PLATFORM }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ env.TARGET_PLATFORM }}-
            Library-

      - name: Build Unity player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          buildName: ${{ env.BUILD_NAME }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          unityVersion: auto
          versioning: Tag

      - name: Package macOS app
        env:
          ASSET_NAME: ${{ env.BUILD_NAME }}-${{ env.RELEASE_TAG }}-macOS.zip
        run: |
          APP_PATH="$(find "build/${TARGET_PLATFORM}" -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "${APP_PATH}" ]; then
            echo "::error::No macOS .app bundle found under build/${TARGET_PLATFORM}"
            exit 1
          fi

          mkdir -p release
          ./scripts/github/package_macos_app.sh "${APP_PATH}" "${GITHUB_WORKSPACE}/release/${ASSET_NAME}"

      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@v6
        with:
          compression-level: 0
          name: PhalanxChronicle-macOS-release-candidate
          path: release/*.zip
          if-no-files-found: error

  sign-and-notarize-macos:
    name: Sign and Notarize macOS App
    runs-on: macos-latest
    needs:
      - preflight
      - build-macos
    if: needs.preflight.outputs.has_apple_notarization_credentials == 'true' && needs.build-macos.result == 'success'
    env:
      APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64 }}
      APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
      APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      APPLE_NOTARY_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}

    steps:
      - name: Download unsigned release candidate
        uses: actions/download-artifact@v6
        with:
          name: PhalanxChronicle-macOS-release-candidate
          path: release-input

      - name: Import Developer ID certificate
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-keychain
        run: |
          CERT_PATH="${RUNNER_TEMP}/developer-id-application.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/developer-id.keychain-db"

          echo "${APPLE_DEVELOPER_ID_APPLICATION_CERT_P12_BASE64}" | base64 --decode > "${CERT_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${APPLE_DEVELOPER_ID_APPLICATION_CERT_PASSWORD}" \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcrun
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security default-keychain -d user -s "${KEYCHAIN_PATH}"

      - name: Sign, notarize, and staple app
        run: |
          INPUT_ZIP="$(find release-input -maxdepth 1 -name '*.zip' -print -quit)"

          if [ -z "${INPUT_ZIP}" ]; then
            echo "::error::No macOS release candidate zip was downloaded."
            exit 1
          fi

          WORK_DIR="${RUNNER_TEMP}/notarization"
          EXTRACT_DIR="${WORK_DIR}/extract"
          SIGNED_DIR="${WORK_DIR}/signed"
          mkdir -p "${EXTRACT_DIR}" "${SIGNED_DIR}" release-output

          ditto -x -k "${INPUT_ZIP}" "${EXTRACT_DIR}"

          APP_PATH="$(find "${EXTRACT_DIR}" -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "${APP_PATH}" ]; then
            echo "::error::No macOS .app bundle found after extracting release candidate."
            exit 1
          fi

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning | awk -F '\"' '/Developer ID Application/ { print $2; exit }')"

          if [ -z "${SIGNING_IDENTITY}" ]; then
            echo "::error::Developer ID Application identity not found after importing certificate."
            exit 1
          fi

          codesign --force --deep --options runtime --timestamp --sign "${SIGNING_IDENTITY}" "${APP_PATH}"
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"

          SIGNED_ZIP="${SIGNED_DIR}/PhalanxChronicle-${RELEASE_TAG}-macOS.zip"
          ditto -c -k --keepParent "${APP_PATH}" "${SIGNED_ZIP}"

          xcrun notarytool submit "${SIGNED_ZIP}" \
            --apple-id "${APPLE_NOTARY_APPLE_ID}" \
            --password "${APPLE_NOTARY_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait

          xcrun stapler staple "${APP_PATH}"
          xcrun stapler validate "${APP_PATH}"

          FINAL_ZIP="release-output/PhalanxChronicle-${RELEASE_TAG}-macOS.zip"
          ditto -c -k --keepParent "${APP_PATH}" "${FINAL_ZIP}"

      - name: Upload notarized release
        uses: actions/upload-artifact@v6
        with:
          compression-level: 0
          name: PhalanxChronicle-macOS-release
          path: release-output/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - preflight
      - build-macos
      - sign-and-notarize-macos
    if: |
      always() &&
      needs.preflight.outputs.has_unity_credentials == 'true' &&
      needs.build-macos.result == 'success' &&
      (needs.sign-and-notarize-macos.result == 'success' || needs.sign-and-notarize-macos.result == 'skipped')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}

    steps:
      - name: Download notarized build
        if: needs.preflight.outputs.has_apple_notarization_credentials == 'true'
        uses: actions/download-artifact@v6
        with:
          name: PhalanxChronicle-macOS-release
          path: release

      - name: Download unsigned release candidate
        if: needs.preflight.outputs.has_apple_notarization_credentials != 'true'
        uses: actions/download-artifact@v6
        with:
          name: PhalanxChronicle-macOS-release-candidate
          path: release

      - name: Show release payload
        run: ls -lah release

      - name: Create or update release
        run: |
          shopt -s nullglob
          assets=(release/*.zip)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --repo "${GH_REPO}" --clobber
            exit 0
          fi

          gh release create "${RELEASE_TAG}" "${assets[@]}" \
            --repo "${GH_REPO}" \
            --generate-notes \
            --latest \
            --target "${GITHUB_SHA}" \
            --title "Phalanx Chronicle ${RELEASE_TAG}"
