name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  BUILD_NAME: PhalanxChronicle
  PROJECT_PATH: .
  TARGET_PLATFORM: StandaloneOSX

jobs:
  preflight:
    name: Release Preconditions
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
    outputs:
      has_unity_credentials: ${{ steps.unity-check.outputs.has_unity_credentials }}
      release_tag: ${{ steps.release-metadata.outputs.release_tag }}

    steps:
      - name: Capture release metadata
        id: release-metadata
        run: |
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Check Unity credentials
        id: unity-check
        run: |
          has_unity_credentials=false

          if [ -n "${UNITY_LICENSE}" ] && [ -n "${UNITY_EMAIL}" ] && [ -n "${UNITY_PASSWORD}" ]; then
            has_unity_credentials=true
          elif [ -n "${UNITY_EMAIL}" ] && [ -n "${UNITY_PASSWORD}" ] && [ -n "${UNITY_SERIAL}" ]; then
            has_unity_credentials=true
          fi

          echo "has_unity_credentials=${has_unity_credentials}" >> "${GITHUB_OUTPUT}"

          if [ "${has_unity_credentials}" != "true" ]; then
            echo "Unity credentials are incomplete, so the macOS build and GitHub Release publish steps will be skipped." >> "${GITHUB_STEP_SUMMARY}"
            echo "Personal license requires UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD." >> "${GITHUB_STEP_SUMMARY}"
            echo "Professional license requires UNITY_EMAIL, UNITY_PASSWORD, and UNITY_SERIAL." >> "${GITHUB_STEP_SUMMARY}"
          fi

  build-macos:
    name: Build macOS Release
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_unity_credentials == 'true'
    env:
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Create local tag for manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag -f "${RELEASE_TAG}" "${GITHUB_SHA}"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.TARGET_PLATFORM }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ env.TARGET_PLATFORM }}-
            Library-

      - name: Build Unity player
        id: build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          buildName: ${{ env.BUILD_NAME }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          unityVersion: auto
          versioning: Tag

      - name: Package macOS app
        env:
          ASSET_NAME: ${{ env.BUILD_NAME }}-${{ env.RELEASE_TAG }}-macOS.zip
        run: |
          APP_PATH="$(find "build/${TARGET_PLATFORM}" -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "${APP_PATH}" ]; then
            echo "::error::No macOS .app bundle found under build/${TARGET_PLATFORM}"
            exit 1
          fi

          mkdir -p release
          ./scripts/github/package_macos_app.sh "${APP_PATH}" "${GITHUB_WORKSPACE}/release/${ASSET_NAME}"

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: PhalanxChronicle-macOS
          path: release/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - preflight
      - build-macos
    if: needs.preflight.outputs.has_unity_credentials == 'true'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}

    steps:
      - name: Download packaged build
        uses: actions/download-artifact@v4
        with:
          name: PhalanxChronicle-macOS
          path: release

      - name: Create or update release
        run: |
          shopt -s nullglob
          assets=(release/*.zip)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            exit 0
          fi

          gh release create "${RELEASE_TAG}" "${assets[@]}" \
            --generate-notes \
            --latest \
            --target "${GITHUB_SHA}" \
            --title "Phalanx Chronicle ${RELEASE_TAG}"
