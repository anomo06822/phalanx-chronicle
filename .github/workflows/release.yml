name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  BUILD_NAME: PhalanxChronicle
  PROJECT_PATH: .
  TARGET_PLATFORM: StandaloneOSX

jobs:
  build-macos:
    name: Build macOS Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

    steps:
      - name: Validate Unity credentials
        run: |
          if [ -n "${UNITY_LICENSE}" ]; then
            exit 0
          fi

          if [ -n "${UNITY_EMAIL}" ] && [ -n "${UNITY_PASSWORD}" ] && [ -n "${UNITY_SERIAL}" ]; then
            exit 0
          fi

          echo "::error::Missing Unity build credentials. Add UNITY_LICENSE, or UNITY_EMAIL + UNITY_PASSWORD + UNITY_SERIAL in GitHub Actions secrets."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Create local tag for manual release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag -f "${RELEASE_TAG}" "${GITHUB_SHA}"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.TARGET_PLATFORM }}-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ env.TARGET_PLATFORM }}-
            Library-

      - name: Build Unity player
        id: build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          buildName: ${{ env.BUILD_NAME }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: ${{ env.TARGET_PLATFORM }}
          unityVersion: auto
          versioning: Tag

      - name: Package macOS app
        env:
          ASSET_NAME: ${{ env.BUILD_NAME }}-${{ env.RELEASE_TAG }}-macOS.zip
        run: |
          APP_PATH="$(find "build/${TARGET_PLATFORM}" -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "${APP_PATH}" ]; then
            echo "::error::No macOS .app bundle found under build/${TARGET_PLATFORM}"
            exit 1
          fi

          mkdir -p release
          ./scripts/github/package_macos_app.sh "${APP_PATH}" "${GITHUB_WORKSPACE}/release/${ASSET_NAME}"

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: PhalanxChronicle-macOS
          path: release/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-macos
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}

    steps:
      - name: Download packaged build
        uses: actions/download-artifact@v4
        with:
          name: PhalanxChronicle-macOS
          path: release

      - name: Create or update release
        run: |
          shopt -s nullglob
          assets=(release/*.zip)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets were downloaded."
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            exit 0
          fi

          gh release create "${RELEASE_TAG}" "${assets[@]}" \
            --generate-notes \
            --latest \
            --target "${GITHUB_SHA}" \
            --title "Phalanx Chronicle ${RELEASE_TAG}"
